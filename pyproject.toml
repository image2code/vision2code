[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="vision2code"
version="0.1.0"
description="Vision2Code benchmark code and utilities."
readme="README.md"
requires-python=">=3.10"
license={file="LICENSE"}
dependencies=["numpy>=1.23","pillow>=9.0","matplotlib>=3.6","pandas>=1.5","kaggle>=1.6","huggingface_hub>=0.20"]
[project.optional-dependencies]
eval=["openai>=1.0","scipy>=1.9","together>=1.3"]
train=["torch","torchvision","transformers","datasets","accelerate","trl","deepspeed"]
tool_use=["playwright"]
dev=["pytest>=7","ruff"]
[tool.setuptools.packages.find]
include=["vision2code*"]
[tool.setuptools.package-data]
"vision2code.ablations.tool_use.vendor.excalidraw_renderer"=["*.js","*.html","*.json","*.md"]
