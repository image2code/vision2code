[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="image2code"
version="0.1.0"
description="Anonymized Image2Code reproducibility code."
readme="README.md"
requires-python=">=3.10"
license={file="LICENSE"}
dependencies=["numpy>=1.23","pillow>=9.0","matplotlib>=3.6","pandas>=1.5"]
[project.optional-dependencies]
eval=["openai>=1.0","scipy>=1.9"]
train=["torch","torchvision","transformers","datasets","accelerate","trl","deepspeed"]
tool_use=["playwright"]
dev=["pytest>=7","ruff"]
[tool.setuptools.packages.find]
include=["image2code*"]
