<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: white;
      }
      canvas {
        display: block;
      }
      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        font: 12px sans-serif;
        color: #b00020;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="status"></pre>
    <script src="./renderer_bundle.js"></script>
    <script>
      async function main() {
        const params = new URLSearchParams(window.location.search);
        const sceneUrl = params.get("scene");
        const width = Number(params.get("width") || 1024);
        const height = Number(params.get("height") || 768);
        document.documentElement.style.width = `${width}px`;
        document.documentElement.style.height = `${height}px`;
        document.body.style.width = `${width}px`;
        document.body.style.height = `${height}px`;
        const root = document.getElementById("root");
        root.style.width = `${width}px`;
        root.style.height = `${height}px`;
        if (!window.renderExcalidrawScene) {
          throw new Error("renderer_bundle.js did not expose window.renderExcalidrawScene");
        }
        const response = await fetch(sceneUrl);
        const scene = await response.json();
        await window.renderExcalidrawScene(scene, root, { width, height });
        document.title = "READY";
      }
      main().catch((error) => {
        document.getElementById("status").textContent = String(error && error.stack ? error.stack : error);
        document.title = "ERROR";
      });
    </script>
  </body>
</html>
